$font = Adwaita Sans

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 92
    font_family = $font
    color = rgba(255, 255, 255, 0.95)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = $font
    color = rgba(255, 255, 255, 0.75)
    position = 0, 60
    halign = center
    valign = center
}

# Password input field, Adwaita-blue accent to match GNOME
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(53, 132, 228, 0.9)   # GNOME/Adwaita blue
    inner_color = rgba(30, 30, 30, 0.6)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Enter password...</span>
    fail_text = <span foreground="##e01b24">Wrong password</span>
    check_color = rgba(53, 132, 228, 1.0)
    hide_input = false
    rounding = 16
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgba(255, 255, 255, 0.85)
    position = 0, -55
    halign = center
    valign = center
}
