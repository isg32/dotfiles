# GNOME dialogs/pickers as floating, centered
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, class:^(org.gnome.Nautilus)$, title:^(Properties|Preferences)$
windowrule = float, title:^(Open File|Save File|File Upload|Open Folder)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(org.gnome.Settings)$
windowrule = center, class:^(org.gnome.Settings)$

# Polkit auth dialog
windowrule = float, class:^(hyprpolkitagent)$
windowrule = center, class:^(hyprpolkitagent)$
windowrule = pin, class:^(hyprpolkitagent)$

# wofi/swaync layer surfaces get no border/shadow duplication
windowrule = noblur, class:^(wofi)$

# Picture-in-picture (browsers) always floating + on top
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = size 480 270, title:^(Picture-in-Picture)$
windowrule = move 100%-500 100%-320, title:^(Picture-in-Picture)$
