$mod = SUPER
$terminal = gnome-console
$fileManager = nautilus
$browser = firefox
$menu = wofi --show drun

# --- Core apps (reusing GNOME apps where they exist) ---
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exec, hyprctl kill
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, P, pseudo
bind = $mod SHIFT, J, togglesplit
bind = $mod SHIFT, E, exec, hyprctl dispatch exit

# --- Lock / quick settings / notifications ---
bind = $mod, L, exec, hyprlock
bind = $mod, N, exec, swaync-client -t -sw          # toggle notification/quick-toggle center
bind = $mod, I, exec, gnome-control-center           # full GNOME Settings app
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- Wallpaper control ---
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-next.sh

# --- Screenshots (hyprshot; saved to ~/Pictures/Screenshots, annotate with satty) ---
bind = , Print, exec, hyprshot -m output --clipboard-only
bind = $mod, Print, exec, hyprshot -m region --raw | satty --filename - --output-filename ~/Pictures/Screenshots/satty-$(date +%Y-%m-%d-%H%M%S).png
bind = $mod SHIFT, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# --- Focus movement (arrows; SUPER+L is reserved for lock, so no vim-style hjkl) ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# --- Move window ---
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# --- Workspaces 1-10 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- Mouse move/resize ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Media / volume / brightness keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Laptop lid: lock immediately, suspend if lid stays closed (hypridle backs this up too) ---
bindl = , switch:on:Lid Switch, exec, hyprlock
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
