general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(3584e4ee) rgba(78aeedee) 45deg   # GNOME/Adwaita blue
    col.inactive_border = rgba(3c3c3c88)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, easeOutExpo, popin 85%
    animation = windowsOut, 1, 3, easeOutExpo, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 3, easeOutExpo
    animation = workspaces, 1, 3, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, easeOutExpo, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# NOTE: there is no working hyprlang syntax for gestures as of Hyprland 0.55 —
# see the "GESTURES / TOUCHPAD WORKSPACE SWIPE" note in README.md / CLAUDE.md.
# workspace_swipe (3-finger trackpad swipe) is currently NOT configured.

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = Adwaita Sans
    background_color = rgb(1e1e1e)
}

# Forces software cursor rendering. Fixes a known ghost/duplicate-cursor bug
# on hybrid Intel+NVIDIA laptops, where aquamarine's hardware cursor plane
# detection gets confused by the presence of the (unused) NVIDIA DRM node
# even when it isn't the primary GPU for this session.
cursor {
    no_hardware_cursors = true
}
