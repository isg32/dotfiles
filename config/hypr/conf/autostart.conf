# --- Reused GNOME services (keeps theming/keyring/secrets consistent with the GNOME session) ---
exec-once = /usr/lib/gsd-xsettings                 # propagates Adwaita GTK theme/fonts/cursor to apps
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# --- Polkit auth agent (gnome-shell normally provides this; Hyprland needs its own) ---
exec-once = hyprpolkitagent

# --- Portals (screen share/screenshot via hyprland portal, file picker via GTK portal) ---
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal-gtk
exec-once = /usr/lib/xdg-desktop-portal

# --- Core UI: bar, notification/quick-toggle center, wallpaper, idle/lock daemon ---
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = sh -c 'sleep 1 && ~/.config/hypr/scripts/wallpaper-restore.sh'
exec-once = hypridle

# --- Clipboard history (used by SUPER+V in keybinds.conf) ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Cursor consistency for layer-shell surfaces before any client sets its own ---
exec-once = hyprctl setcursor Adwaita 24
