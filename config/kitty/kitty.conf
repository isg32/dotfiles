# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Window — let Hyprland's own rounding/blur/border handle the frame
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.92
dynamic_background_opacity yes

# Tabs (minimal, Adwaita-blue accent)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_foreground   #ffffff
active_tab_background   #3584e4
inactive_tab_foreground #9a9996
inactive_tab_background #2a2a2a

# Bell
enable_audio_bell no

# Scrollback
scrollback_lines 10000

# Adwaita-dark-ish palette
background            #1e1e1e
foreground             #e3e3e3
selection_background   #3584e4
selection_foreground   #ffffff
cursor                 #3584e4
cursor_text_color      #1e1e1e
url_color              #78aeed

# black
color0  #241f31
color8  #5e5c64
# red
color1  #e01b24
color9  #f66151
# green
color2  #2ec27e
color10 #57e389
# yellow
color3  #f5c211
color11 #f8e45c
# blue
color4  #3584e4
color12 #78aeed
# magenta
color5  #9141ac
color13 #c061cb
# cyan
color6  #0ab9dc
color14 #4fd2fd
# white
color7  #deddda
color15 #ffffff

allow_remote_control no
shell_integration enabled
