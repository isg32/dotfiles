width=1100
height=780
location=center
show=dmenu
prompt=Pick a wallpaper...
allow_images=true
dmenu-parse_action=true
# wofi's grid is a homogeneous GtkFlowBox: it always divides `width` evenly
# across `columns` regardless of image_size, and no CSS can override that
# (confirmed against wofi's own source). image_size is tuned to roughly fill
# a column here — if you change width/columns, re-tune this to match or
# you'll get a gap next to each thumbnail again.
image_size=500
columns=2
orientation=vertical
gtk_dark=true
insensitive=true
